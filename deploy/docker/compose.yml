services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Set PANEL_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - public
      - backend
    depends_on:
      wanglou-server:
        condition: service_healthy

  wanglou-server:
    image: ${WANGLOU_SERVER_IMAGE:-wanglou-server:local}
    build:
      context: ../..
      target: server
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    environment:
      WANGLOU_DATABASE: /data/wanglou.db
      WANGLOU_LISTEN: ":8080"
      WANGLOU_PANEL_LISTEN: ":8081"
      WANGLOU_PUBLIC_INGEST_URL: https://${DOMAIN}
      WANGLOU_LISTEN_PLAIN: "true"
      WANGLOU_TRUSTED_PROXIES: ${WANGLOU_BACKEND_SUBNET:-172.30.0.0/24}
      WANGLOU_TELEGRAM_TOKEN: ${WANGLOU_TELEGRAM_TOKEN:-}
      WANGLOU_TELEGRAM_CHAT_ID: ${WANGLOU_TELEGRAM_CHAT_ID:-}
      WANGLOU_WEBHOOK_URL: ${WANGLOU_WEBHOOK_URL:-}
    volumes:
      - server_data:/data
    networks:
      - backend
    healthcheck:
      test: [CMD, wanglou-server, healthcheck]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  public:
  backend:
    ipam:
      config:
        - subnet: ${WANGLOU_BACKEND_SUBNET:-172.30.0.0/24}

volumes:
  server_data:
  caddy_data:
  caddy_config:
