name: CI
'on': [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-go@v5.0.2
        with:
          go-version: '1.26.x'
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: make check-agent-surface
      - run: make check-panel-assets
      - run: make check-files
