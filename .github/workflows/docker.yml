name: Docker images
'on':
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [server, agent]
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Select publishing mode
        id: publish
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" != pull_request && -n "$DOCKERHUB_USERNAME" && -n "$DOCKERHUB_TOKEN" ]]; then
            echo 'push=true' >> "$GITHUB_OUTPUT"
            echo "image=docker.io/${DOCKERHUB_USERNAME}/sand-monitor-${TARGET}" >> "$GITHUB_OUTPUT"
          else
            echo 'push=false' >> "$GITHUB_OUTPUT"
            echo "image=local/sand-monitor-${TARGET}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-qemu-action@v3.6.0
      - uses: docker/setup-buildx-action@v3.10.0
      - uses: docker/login-action@v3.4.0
        if: steps.publish.outputs.push == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5.7.0
        id: meta
        with:
          images: ${{ steps.publish.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=pr
      - uses: docker/build-push-action@v6.15.0
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.publish.outputs.push == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
